  <script>
    const TEST_MODE = false;
    const target = TEST_MODE ? new Date(Date.now() - 1000) : new Date(2026, 5, 6, 18, 6, 6);
    const themes = ["midnight", "champagne", "studio", "ruby", "aurora", "porcelain", "neon", "gala"];
    let themeIndex = 0;
    let startX = null;
    let themeTimer = null;
    let celebrationStarted = false;
    const clockEl = document.getElementById("clock");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const confettiEl = document.getElementById("confetti");
    const fireworksEl = document.getElementById("fireworks");
    const barrageEl = document.getElementById("barrage");
    const skyEl = document.getElementById("sky");

    const colors = ["#f3c969", "#5fd0a5", "#ef6f61", "#7eb6ff", "#f6f1e8"];
    for (let i = 0; i < 84; i += 1) {
      const piece = document.createElement("span");
      piece.className = "piece";
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = `${Math.random() * 4}s`;
      piece.style.animationDuration = `${4 + Math.random() * 3}s`;
      confettiEl.appendChild(piece);
    }

    for (let i = 0; i < 128; i += 1) {
      const star = document.createElement("span");
      const size = 1 + Math.random() * 3.6;
      star.className = "star";
      star.style.setProperty("--size", `${size}px`);
      star.style.setProperty("--x", `${Math.random() * 100}%`);
      star.style.setProperty("--y", `${Math.random() * 100}%`);
      star.style.setProperty("--alpha", `${0.38 + Math.random() * 0.58}`);
      star.style.setProperty("--duration", `${1.8 + Math.random() * 3.8}s`);
      star.style.setProperty("--delay", `${Math.random() * 4}s`);
      skyEl.appendChild(star);
    }

    for (let i = 0; i < 72; i += 1) {
      const meteor = document.createElement("span");
      meteor.className = "meteor";
      meteor.style.setProperty("--top", `${-8 + Math.random() * 116}%`);
      meteor.style.setProperty("--left", `${-92 + Math.random() * 42}%`);
      meteor.style.setProperty("--angle", `${-38 + Math.random() * 16}deg`);
      meteor.style.setProperty("--speed", `${3.8 + Math.random() * 5.2}s`);
      meteor.style.setProperty("--delay", `${i * 0.16 + Math.random() * 3.6}s`);
      skyEl.appendChild(meteor);
    }

    function startCelebration() {
      if (celebrationStarted) return;
      celebrationStarted = true;
      document.body.classList.add("celebrate");

      for (let i = 0; i < 96; i += 1) {
        const danmu = document.createElement("span");
        danmu.className = "danmu";
        danmu.textContent = i % 5 === 0 ? "666 666 666" : "666";
        danmu.style.setProperty("--top", `${Math.random() * 94}%`);
        danmu.style.setProperty("--size", `${32 + Math.random() * 54}px`);
        danmu.style.setProperty("--speed", `${7 + Math.random() * 7}s`);
        danmu.style.setProperty("--delay", `${Math.random() * 8}s`);
        barrageEl.appendChild(danmu);
      }

      const sparkColors = ["#fff5b8", "#ffd36b", "#ff7867", "#7df5ff", "#9effb9", "#f4f1ff"];
      for (let i = 0; i < 120; i += 1) {
        const firework = document.createElement("span");
        const speed = 2.4 + Math.random() * 2.8;
        const delay = Math.random() * 8;
        const haloColor = sparkColors[i % sparkColors.length];
        firework.className = "firework";
        firework.style.setProperty("--x", `${2 + Math.random() * 96}%`);
        firework.style.setProperty("--y", `${2 + Math.random() * 86}%`);
        firework.style.setProperty("--speed", `${speed}s`);
        firework.style.setProperty("--delay", `${delay}s`);
        firework.style.setProperty("--halo-size", `${80 + Math.random() * 190}px`);
        firework.style.setProperty("--halo-color", haloColor);

        for (let j = 0; j < 38; j += 1) {
          const spark = document.createElement("span");
          spark.className = "spark";
          spark.style.setProperty("--angle", `${(360 / 38) * j + Math.random() * 8}deg`);
          spark.style.setProperty("--distance", `${92 + Math.random() * 210}px`);
          spark.style.setProperty("--spark-size", `${4 + Math.random() * 8}px`);
          spark.style.setProperty("--spark-color", sparkColors[(i + j) % sparkColors.length]);
          spark.style.setProperty("--speed", `${speed}s`);
          spark.style.setProperty("--delay", `${delay}s`);
          firework.appendChild(spark);
        }

        fireworksEl.appendChild(firework);
      }
    }

    function setTheme(index) {
      themeIndex = (index + themes.length) % themes.length;
      document.body.dataset.theme = themes[themeIndex];
    }

    function moveTheme(direction) {
      setTheme(themeIndex + direction);
    }

    function restartThemeTimer() {
      window.clearInterval(themeTimer);
      themeTimer = window.setInterval(() => moveTheme(1), 5000);
    }

    function fitMomentText() {
      const availableWidth = Math.max(260, Math.floor(window.innerWidth * (window.innerWidth <= 680 ? 0.98 : 0.95)));
      let low = 18;
      let high = Math.floor(window.innerHeight * (window.innerWidth <= 680 ? 0.14 : 0.22));

      while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        clockEl.style.fontSize = `${middle}px`;
        if (clockEl.scrollWidth <= availableWidth) {
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }

      clockEl.style.fontSize = `${Math.max(18, high)}px`;
    }

    function render() {
      const now = new Date();
      const remaining = Math.max(0, target - now);
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const hour12 = now.getHours() % 12 || 12;
      const weekday = now.getDay();

      clockEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日周${weekday} ${hour12}点${now.getMinutes()}分${now.getSeconds()}秒`;
      fitMomentText();
      daysEl.textContent = days;
      hoursEl.textContent = hours;
      minutesEl.textContent = minutes;
      secondsEl.textContent = seconds;

      if (remaining === 0) {
        startCelebration();
      }
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        moveTheme(-1);
        restartThemeTimer();
      }
      if (event.key === "ArrowRight") {
        moveTheme(1);
        restartThemeTimer();
      }
    });
    window.addEventListener("touchstart", (event) => {
      startX = event.touches[0].clientX;
    }, { passive: true });
    window.addEventListener("touchend", (event) => {
      if (startX === null) return;
      const distance = event.changedTouches[0].clientX - startX;
      if (Math.abs(distance) > 48) {
        moveTheme(distance < 0 ? 1 : -1);
        restartThemeTimer();
      }
      startX = null;
    }, { passive: true });
    window.addEventListener("resize", fitMomentText);
    window.addEventListener("orientationchange", () => window.setTimeout(fitMomentText, 300));

    setTheme(0);
    restartThemeTimer();
    render();
    setInterval(render, 250);
  </script>
</body>
</html>
